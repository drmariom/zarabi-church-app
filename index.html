                            <Icon name="sparkles" className="w-6 h-6" />  
                            <h3 className="font-bold text-lg text-slate-800">{title}</h3>  
                        </div>  
                        <p className="text-slate-600 text-sm mb-6 leading-relaxed">{message}</p>  
                        <div className="flex items-center justify-end gap-3">  
                            <button onClick={onCancel} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100 transition-colors">  
                                إلغاء  
                            </button>  
                            <button onClick={onConfirm} className="px-5 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white shadow-md transition-colors">  
                                تأكيد  
                            </button>  
                        </div>  
                    </div>  
                </div>  
            );  
        };  
  
        // Main App Component  
        function App() {  
            const [questions, setQuestions] = useState([]);  
            const [searchQuery, setSearchQuery] = useState('');  
            const [selectedCategory, setSelectedCategory] = useState('الكل');  
            const [activeQuestion, setActiveQuestion] = useState(null);  
            const [favorites, setFavorites] = useState([]);  
            const [viewMode, setViewMode] = useState('home'); // 'home', 'favorites', 'admin', 'ai'  
            const [toastMessage, setToastMessage] = useState(null);  
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);  
  
            // Install PWA Prompt State  
            const [deferredPrompt, setDeferredPrompt] = useState(null);  
  
            // Admin Auth state  
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);  
            const [adminPin, setAdminPin] = useState('1234');  
            const [showLoginModal, setShowLoginModal] = useState(false);  
            const [passwordInput, setPasswordInput] = useState('');  
            const [loginError, setLoginError] = useState('');  
  
            // Admin change password state  
            const [showChangePinModal, setShowChangePinModal] = useState(false);  
            const [newPinInput, setNewPinInput] = useState('');  
  
            // Admin editing state  
            const [editingQuestion, setEditingQuestion] = useState(null);  
            const [sheetUrl, setSheetUrl] = useState('');  
  
            // AI Servant state (Gemini API)  
            const [aiQuery, setAiQuery] = useState('');  
            const [aiResponse, setAiResponse] = useState('');  
            const [aiLoading, setAiLoading] = useState(false);  
  
            // Custom Confirm Dialog State  
            const [confirmState, setConfirmState] = useState({ isOpen: false, title: '', message: '', onConfirm: null });  
  
            // PWA beforeinstallprompt handler  
            useEffect(() => {  
                const handleBeforeInstall = (e) => {  
                    e.preventDefault();  
                    setDeferredPrompt(e);  
                };  
                window.addEventListener('beforeinstallprompt', handleBeforeInstall);  
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstall);  
            }, []);  
  
            // Helper function to process CSV data  
            const parseAndSetQuestions = (csvText, isAutoSync = false) => {  
                Papa.parse(csvText, {  
                    header: true,  
                    skipEmptyLines: true,  
                    complete: (results) => {  
                        if (results.data && results.data.length > 0) {  
                            const imported = results.data.map((row, idx) => {  
                                const getVal = (possibleKeys) => {  
                                    for (let k of possibleKeys) {  
                                        const key = Object.keys(row).find(x => x && x.trim().toLowerCase() === k.toLowerCase());  
                                        if (key && row[key]) return row[key].trim();  
                                    }  
                                    return '';  
                                };  
  
                                return {  
                                    id: String(getVal(['id', 'رقم', 'م']) || Date.now() + idx),  
                                    question: getVal(['question', 'السؤال', 'سؤال', 'س']),  
                                    answer: getVal(['answer', 'الاجابة', 'الإجابة', 'اجابة', 'إجابة', 'ج']),  
                                    category: getVal(['category', 'القسم', 'التصنيف', 'قسم']) || 'أسئلة عامة',  
                                    verse: getVal(['verse', 'الآية', 'اية', 'الآيه', 'المرجع']),  
                                    source: getVal(['source', 'المصدر', 'مصدر']),  
                                    keywords: getVal(['keywords', 'كلمات مفتاحية', 'الكلمات المفتاحية', 'tags'])  
                                };  
                            }).filter(q => q.question && q.answer);  
  
                            if (imported.length > 0) {  
                                setQuestions(imported);  
                                localStorage.setItem('zarabi_church_questions', JSON.stringify(imported));  
                                if (!isAutoSync) {  
                                    showToast(`تم استيراد ${imported.length} سؤال بنجاح! 🎉`);  
                                    setViewMode('home');  
                                }  
                            }  
                        }  
                    }  
                });  
            };  
  
            // Load initial data on mount  
            useEffect(() => {  
                let currentQuestions = DEFAULT_QUESTIONS;  
                const savedQuestions = localStorage.getItem('zarabi_church_questions');  
                if (savedQuestions) {  
                    try {  
                        currentQuestions = JSON.parse(savedQuestions);  
                        setQuestions(currentQuestions);  
                    } catch (e) {  
                        setQuestions(DEFAULT_QUESTIONS);  
                    }  
                } else {  
                    setQuestions(DEFAULT_QUESTIONS);  
                    localStorage.setItem('zarabi_church_questions', JSON.stringify(DEFAULT_QUESTIONS));  
                }  
  
                // Check for saved Google Sheet URL for auto-sync  
                const savedSheetUrl = localStorage.getItem('zarabi_church_sheet_url');  
                if (savedSheetUrl) {  
                    setSheetUrl(savedSheetUrl);  
                    let fetchUrl = savedSheetUrl.trim();  
                    if (fetchUrl.includes('docs.google.com/spreadsheets') && !fetchUrl.includes('export?format=csv')) {  
                        const match = fetchUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);  
                        if (match && match[1]) {  
                            fetchUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv`;  
                        }  
                    }  
                    fetch(fetchUrl)  
                        .then(res => res.ok ? res.text() : Promise.reject())  
                        .then(text => parseAndSetQuestions(text, true))  
                        .catch(() => {});  
                }  
  
                const savedFavs = localStorage.getItem('zarabi_church_favs');  
                if (savedFavs) {  
                    try { setFavorites(JSON.parse(savedFavs)); } catch (e) {}  
                }  
  
                const savedPin = localStorage.getItem('zarabi_church_admin_pin');  
                if (savedPin) {  
                    setAdminPin(savedPin);  
                }  
  
                // Check URL hash for direct question sharing (#/q/1)  
                const checkHash = () => {  
                    const hash = window.location.hash.replace('#/q/', '');  
                    if (hash) {  
                        const found = currentQuestions.find(q => String(q.id) === String(hash));  
                        if (found) setActiveQuestion(found);  
                    }  
                };  
  
                checkHash();  
                window.addEventListener('hashchange', checkHash);  
                return () => window.removeEventListener('hashchange', checkHash);  
            }, []);  
  
            // Trigger Direct PWA Install  
            const handleInstallApp = () => {  
                if (deferredPrompt) {  
                    deferredPrompt.prompt();  
                    deferredPrompt.userChoice.then((choice) => {  
                        if (choice.outcome === 'accepted') {  
                            showToast('تمت إضافة التطبيق للشاشة الرئيسية بنجاح 🎉');  
                        }  
                        setDeferredPrompt(null);  
                    });  
                } else {  
                    showToast('اختر "إضافة إلى الشاشة الرئيسية" (Add to Home Screen) من قائمة المتصفح 📲');  
                }  
            };  
  
            const saveQuestionsToStorage = (newQuestions) => {  
                setQuestions(newQuestions);  
                localStorage.setItem('zarabi_church_questions', JSON.stringify(newQuestions));  
            };  
  
            const showToast = (msg) => {  
                setToastMessage(msg);  
                setTimeout(() => setToastMessage(null), 3200);  
            };  
  
            const handleAdminLogin = (e) => {  
                e.preventDefault();  
                if (passwordInput.trim() === adminPin) {  
                    setIsAdminLoggedIn(true);  
                    setShowLoginModal(false);  
                    setPasswordInput('');  
                    setLoginError('');  
                    setViewMode('admin');  
                    showToast('تم تسجيل الدخول بصلاحيات المسؤول 🔑');  
                } else {  
                    setLoginError('كلمة المرور غير صحيحة! حاول مرة أخرى.');  
                }  
            };  
  
            const handleChangePin = (e) => {  
                e.preventDefault();  
                if (newPinInput.trim().length < 3) {  
                    showToast('كلمة المرور يجب أن تكون 3 أحرف أو أرقام على الأقل');  
                    return;  
                }  
                setAdminPin(newPinInput.trim());  
                localStorage.setItem('zarabi_church_admin_pin', newPinInput.trim());  
                setShowChangePinModal(false);  
                setNewPinInput('');  
                showToast('تم تغيير كلمة مرور المسؤول بنجاح 🔒');  
            };  
  
            const handleAdminLogout = () => {  
                setIsAdminLoggedIn(false);  
                setViewMode('home');  
                showToast('تم تسجيل الخروج وقفل لوحة التحكم 🔒');  
            };  
  
            const navigateToAdmin = () => {  
                if (isAdminLoggedIn) {  
                    setViewMode('admin');  
                } else {  
                    setShowLoginModal(true);  
                }  
            };  
  
            // Filtered Categories  
            const categories = useMemo(() => {  
                const set = new Set();  
                questions.forEach(q => {  
                    if (q.category && q.category.trim()) {  
                        set.add(q.category.trim());  
                    }  
                });  
                return ['الكل', ...Array.from(set)];  
            }, [questions]);  
  
            // Filtered Questions list  
            const filteredQuestions = useMemo(() => {  
                return questions.filter(q => {  
                    const matchesCategory = selectedCategory === 'الكل' || q.category === selectedCategory;  
                    const query = searchQuery.trim().toLowerCase();  
                    if (!query) return matchesCategory;  
  
                    const inQuestion = q.question && q.question.toLowerCase().includes(query);  
                    const inAnswer = q.answer && q.answer.toLowerCase().includes(query);  
                    const inCategory = q.category && q.category.toLowerCase().includes(query);  
                    const inKeywords = q.keywords && q.keywords.toLowerCase().includes(query);  
  
                    return matchesCategory && (inQuestion || inAnswer || inCategory || inKeywords);  
                });  
            }, [questions, selectedCategory, searchQuery]);  
  
            // Question of the Day based on current date  
            const questionOfTheDay = useMemo(() => {  
                if (questions.length === 0) return null;  
                const today = new Date().toISOString().slice(0, 10);  
                let hash = 0;  
                for (let i = 0; i < today.length; i++) {  
                    hash = today.charCodeAt(i) + ((hash << 5) - hash);  
                }  
                const index = Math.abs(hash) % questions.length;  
                return questions[index];  
            }, [questions]);  
  
            const toggleFavorite = (qId, e) => {  
                if (e) e.stopPropagation();  
                let updated;  
                if (favorites.includes(qId)) {  
                    updated = favorites.filter(id => id !== qId);  
                    showToast('تمت إزالة السؤال من المفضلة');  
                } else {  
                    updated = [...favorites, qId];  
                    showToast('تم حفظ السؤال في المفضلة ⭐');  
                }  
                setFavorites(updated);  
                localStorage.setItem('zarabi_church_favs', JSON.stringify(updated));  
            };  
  
            const pickRandomQuestion = () => {  
                if (questions.length === 0) return;  
                const randomIndex = Math.floor(Math.random() * questions.length);  
                const randomQ = questions[randomIndex];  
                setActiveQuestion(randomQ);  
                window.location.hash = `#/q/${randomQ.id}`;  
            };  
  
            const handleShare = (q, e) => {  
                if (e) e.stopPropagation();  
                const shareUrl = `${window.location.origin}${window.location.pathname}#/q/${q.id}`;  
                  
                if (navigator.share) {  
                    navigator.share({  
                        title: q.question,  
                        text: `إليك إجابة سؤال: ${q.question} - كنيسة الأنبا شنودة بالزرابي`,  
                        url: shareUrl  
                    }).catch(() => {});  
                } else {  
                    navigator.clipboard.writeText(shareUrl);  
                    showToast('تم نسخ رابط السؤال إلى الحافظة 📋');  
                }  
            };  
  
            const handleSpeakText = (text) => {  
                if ('speechSynthesis' in window) {  
                    window.speechSynthesis.cancel();  
                    const utterance = new SpeechSynthesisUtterance(text);  
                    utterance.lang = 'ar-EG';  
                    utterance.rate = 0.9;  
                    window.speechSynthesis.speak(utterance);  
                    showToast('جاري قراءة النص صوتياً 🔊');  
                } else {  
                    showToast('عذراً، القراءة الصوتية غير مدعومة في متصفحك');  
                }  
            };  
  
            const handleAskAI = async () => {  
                if (!aiQuery.trim()) return;  
                setAiLoading(true);  
                setAiResponse('');  
                try {  
                    const systemPrompt = `أنت خادم كنسي قبطي أرثوذكسي حكيم، محب، ومُشجع برعية كنيسة الأنبا شنودة رئيس المتوحدين بالزرابي. تجيب على أسئلة الشباب الإيمانية والكتابية بطريقة مبسطة، دافئة، ومعززة بالآيات من الكتاب المقدس وأقوال الآباء (مثل البابا شنودة الثالث والقديس كيرلس الكبير). التزم تماماً بالإيمان القبطي الأرثوذكسي المسكوني.`;  
                      
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=`, {  
                        method: 'POST',  
                        headers: { 'Content-Type': 'application/json' },  
                        body: JSON.stringify({  
                            contents: [{ parts: [{ text: `سؤال من أحد شباب الكنيسة: ${aiQuery}` }] }],  
                            systemInstruction: { parts: [{ text: systemPrompt }] }  
                        })  
                    });  
  
                    const data = await response.json();  
                    if (data && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {  
                        setAiResponse(data.candidates[0].content.parts[0].text);  
                    } else {  
                        setAiResponse("نعتذر، لم نتمكن من الحصول على إجابة في الوقت الحالي. حاول مرة أخرى لاحقاً.");  
                    }  
                } catch (err) {  
                    setAiResponse("حدث خطأ في الاتصال بالخادم الذكي. يرجى التأكد من اتصال الإنترنت والمحاولة مجدداً.");  
                } finally {  
                    setAiLoading(false);  
                }  
            };  
  
            const handleSaveAIAsQuestion = () => {  
                if (!aiQuery || !aiResponse) return;  
                const newQ = {  
                    id: String(Date.now()),  
                    question: aiQuery.trim(),  
                    answer: aiResponse.trim(),  
                    category: "أسئلة الخادم الذكي",  
                    verse: "",  
                    source: "إجابة الخادم الذكي",  
                    keywords: "AI, خادم ذكي"  
                };  
                const updated = [newQ, ...questions];  
                saveQuestionsToStorage(updated);  
                showToast("تمت إضافة السؤال مع إجابته إلى قائمة الكنيسة بنجاح! 🎉");  
            };  
  
            // Admin Actions  
            const handleSaveQuestionForm = (e) => {  
                e.preventDefault();  
                const formData = new FormData(e.target);  
                const qData = {  
                    id: editingQuestion?.id || String(Date.now()),  
                    question: formData.get('question').trim(),  
                    answer: formData.get('answer').trim(),  
                    category: formData.get('category').trim() || 'أسئلة عامة',  
                    verse: formData.get('verse').trim(),  
                    source: formData.get('source').trim(),  
                    keywords: formData.get('keywords').trim()  
                };  
  
                let updated;  
                if (editingQuestion?.id) {  
                    updated = questions.map(q => q.id === editingQuestion.id ? qData : q);  
                    showToast('تم تحديث السؤال بنجاح ✨');  
                } else {  
                    updated = [qData, ...questions];  
                    showToast('تمت إضافة السؤال الجديد بنجاح ✨');  
                }  
                saveQuestionsToStorage(updated);  
                setEditingQuestion(null);  
            };  
  
            const handleDeleteQuestion = (qId) => {  
                setConfirmState({  
                    isOpen: true,  
                    title: "حذف السؤال",  
                    message: "هل أنت تأكد من رغبتك في حذف هذا السؤال نهائياً من القائمة؟",  
                    onConfirm: () => {  
                        const updated = questions.filter(q => q.id !== qId);  
                        saveQuestionsToStorage(updated);  
                        setConfirmState({ isOpen: false });  
                        showToast('تم حذف السؤال بنجاح');  
                    }  
                });  
            };  
  
            const handleResetDefaults = () => {  
                setConfirmState({  
                    isOpen: true,  
                    title: "استعادة البيانات الافتراضية",  
                    message: "سيتم حذف التعديلات الحالية واستعادة مجموعة الأسئلة الافتراضية، هل تريد المتابعة؟",  
                    onConfirm: () => {  
                        saveQuestionsToStorage(DEFAULT_QUESTIONS);  
                        setConfirmState({ isOpen: false });  
                        showToast('تمت استعادة الأسئلة الافتراضية بنجاح 🔄');  
                    }  
                });  
            };  
  
            const handleExportCSV = () => {  
                const csv = Papa.unparse(questions);  
                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });  
                const link = document.createElement("a");  
                link.href = URL.createObjectURL(blob);  
                link.download = `zarabi_church_questions_${new Date().toISOString().slice(0, 10)}.csv`;  
                link.click();  
                showToast('تم تصدير قاعدة الأسئلة بنجاح 📥');  
            };  
  
            const handleFileUpload = (e) => {  
                const file = e.target.files[0];  
                if (file) {  
                    const reader = new FileReader();  
                    reader.onload = (event) => {  
                        parseAndSetQuestions(event.target.result);  
                    };  
                    reader.readAsText(file);  
                }  
            };  
  
            const handleSyncSheet = () => {  
                if (!sheetUrl.trim()) {  
                    showToast('يرجى أدخال رابط Google Sheets أو CSV أولاً');  
                    return;  
                }  
                let fetchUrl = sheetUrl.trim();  
                if (fetchUrl.includes('docs.google.com/spreadsheets') && !fetchUrl.includes('export?format=csv')) {  
                    const match = fetchUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);  
                    if (match && match[1]) {  
                        fetchUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv`;  
                    }  
                }  
                  
                localStorage.setItem('zarabi_church_sheet_url', sheetUrl.trim());  
  
                fetch(fetchUrl)  
                    .then(res => res.ok ? res.text() : Promise.reject())  
                    .then(text => parseAndSetQuestions(text))  
                    .catch(() => showToast('فشل الاستيراد! تأكد أن الرابط عام ومتاح للجميع ⚠️'));  
            };  
  
            return (  
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">  
                      
                    <!-- Header -->  
                    <header className="sticky top-0 z-40 bg-church-navyDark text-white shadow-xl border-b border-amber-500/20">  
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">  
                            <div className="flex items-center justify-between h-16 sm:h-20">  
                                  
                                <!-- Brand Logo & Title -->  
                                <div className="flex items-center gap-3 cursor-pointer" onclick={() => setViewMode('home')}>  
                                    <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-church-navyDark font-extrabold shadow-lg shadow-amber-500/20">  
                                        <Icon name="cross" className="w-6 h-6 sm:w-7 sm:h-7" />  
                                    </div>  
                                    <div>  
                                        <h1 className="font-extrabold text-sm sm:text-base md:text-lg leading-tight text-amber-300">أسئلة شبكية</h1>  
                                        <p className="text-[11px] sm:text-xs text-slate-300 font-medium">كنيسة الأنبا شنودة بالزرابي</p>  
                                    </div>  
                                </div>  
  
                                <!-- Desktop Nav Links -->  
                                <nav className="hidden md:flex items-center gap-1 bg-slate-800/60 p-1.5 rounded-2xl border border-slate-700/50">  
                                    <button   
                                        onClick={() => setViewMode('home')}   
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${viewMode === 'home' ? 'bg-amber-500 text-slate-900 shadow-md' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'}`}  
                                    >  
                                        <Icon name="book" className="w-4 h-4" />  
                                        <span>الأسئلة</span>  
                                    </button>  
                                    <button   
                                        onClick={() => setViewMode('favorites')}   
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${viewMode === 'favorites' ? 'bg-amber-500 text-slate-900 shadow-md' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'}`}  
                                    >  
                                        <Icon name="star" className="w-4 h-4" />  
                                        <span>المفضلة</span>  
                                        {favorites.length > 0 && (  
                                            <span className="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-black">  
                                                {favorites.length}  
                                            </span>  
                                        )}  
                                    </button>  
                                    <button   
                                        onClick={() => setViewMode('ai')}   
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${viewMode === 'ai' ? 'bg-amber-500 text-slate-900 shadow-md' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'}`}  
                                    >  
                                        <Icon name="sparkles" className="w-4 h-4" />  
                                        <span>الخادم الذكي</span>  
                                    </button>  
                                </nav>  
  
                                <!-- Header Action Buttons -->  
                                <div className="flex items-center gap-2">  
                                    {deferredPrompt && (  
                                        <button   
                                            onClick={handleInstallApp}  
                                            className="hidden sm:flex items-center gap-1.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition"  
                                        >  
                                            <Icon name="mobile" className="w-4 h-4" />  
                                            <span>تثبيت التطبيق</span>  
                                        </button>  
                                    )}  
  
                                    <button   
                                        onClick={navigateToAdmin}  
                                        className={`p-2.5 rounded-xl border text-xs font-bold transition flex items-center gap-1.5 ${isAdminLoggedIn ? 'bg-emerald-600/20 text-emerald-300 border-emerald-500/40' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}  
                                        title="لوحة التحكم والمسؤول"  
                                    >  
                                        <Icon name="settings" className="w-4 h-4" />

                                    </div>  
                                </div>  
  
                                <!-- Google Sheets Sync Box -->  
                                <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">  
                                    <div className="flex items-center gap-2 text-slate-900 font-bold text-sm">  
                                        <Icon name="refresh" className="text-amber-600" />  
                                        <span>مزامنة مع Google Sheets (أو رابط CSV)</span>  
                                    </div>  
                                    <p className="text-xs text-slate-500 leading-relaxed">  
                                        ضع رابط الشيت المنشور كـ CSV (أو رابط الشيت العام) لمزامنة الأسئلة تلقائياً عبر الأجهزة:  
                                    </p>  
                                    <div className="flex flex-col sm:flex-row gap-2">  
                                        <input   
                                            type="text"   
                                            value={sheetUrl}  
                                            onChange={(e) => setSheetUrl(e.target.value)}  
                                            placeholder="https://docs.google.com/spreadsheets/d/.../export?format=csv"  
                                            className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-amber-500"  
                                        />  
                                        <button   
                                            onClick={handleSyncSheet}  
                                            className="bg-slate-900 hover:bg-slate-800 text-amber-300 font-bold text-xs px-5 py-2.5 rounded-xl transition shadow"  
                                        >  
                                            مزامنة الآن  
                                        </button>  
                                    </div>  
                                </div>  
  
                                <!-- Backup & Import Controls -->  
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">  
                                    <button   
                                        onClick={handleExportCSV}  
                                        className="bg-white hover:bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between text-right transition"  
                                    >  
                                        <div>  
                                            <h4 className="font-bold text-xs text-slate-800">تصدير الأسئلة (CSV)</h4>  
                                            <p className="text-[11px] text-slate-400">حفظ نسخة احتياطية من الأسئلة</p>  
                                        </div>  
                                        <Icon name="download" className="text-amber-600" />  
                                    </button>  
  
                                    <label className="bg-white hover:bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between text-right cursor-pointer transition">  
                                        <div>  
                                            <h4 className="font-bold text-xs text-slate-800">رفع ملف CSV جديد</h4>  
                                            <p className="text-[11px] text-slate-400">استبدال أو إضافة مجموعة أسئلة</p>  
                                        </div>  
                                        <Icon name="upload" className="text-amber-600" />  
                                        <input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" />  
                                    </label>  
  
                                    <button   
                                        onClick={handleResetDefaults}  
                                        className="bg-white hover:bg-rose-50 p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between text-right transition"  
                                    >  
                                        <div>  
                                            <h4 className="font-bold text-xs text-rose-700">استعادة الأسئلة الافتراضية</h4>  
                                            <p className="text-[11px] text-slate-400">إعادة ضبط المصنع للأسئلة</p>  
                                        </div>  
                                        <Icon name="refresh" className="text-rose-600" />  
                                    </button>  
                                </div>  
  
                                <!-- Admin Questions Management Table -->  
                                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">  
                                    <div className="p-5 border-b border-slate-100 flex items-center justify-between">  
                                        <h3 className="font-bold text-slate-800 text-sm">قائمة الأسئلة المسجلة ({questions.length})</h3>  
                                    </div>  
  
                                    <div className="divide-y divide-slate-100">  
                                        {questions.map((q, i) => (  
                                            <div key={q.id} className="p-4 sm:p-5 hover:bg-slate-50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 transition">  
                                                <div className="space-y-1 max-w-3xl">  
                                                    <div className="flex items-center gap-2">  
                                                        <span className="text-[11px] font-bold bg-amber-100 text-amber-900 px-2 py-0.5 rounded">  
                                                            #{i+1} - {q.category}  
                                                        </span>  
                                                        {q.verse && <span className="text-[10px] text-slate-400">آية متوفرة</span>}  
                                                    </div>  
                                                    <h4 className="font-bold text-slate-900 text-sm">{q.question}</h4>  
                                                    <p className="text-xs text-slate-500 line-clamp-1">{q.answer}</p>  
                                                </div>  
  
                                                <div className="flex items-center gap-2 w-full sm:w-auto justify-end">  
                                                    <button   
                                                        onClick={() => setEditingQuestion(q)}  
                                                        className="p-2 rounded-xl bg-slate-100 hover:bg-amber-100 text-slate-700 hover:text-amber-900 text-xs font-bold transition flex items-center gap-1"  
                                                    >  
                                                        <Icon name="edit" className="w-4 h-4" />  
                                                        <span>تعديل</span>  
                                                    </button>  
                                                    <button   
                                                        onClick={() => handleDeleteQuestion(q.id)}  
                                                        className="p-2 rounded-xl bg-slate-100 hover:bg-rose-100 text-slate-700 hover:text-rose-700 text-xs font-bold transition"  
                                                    >  
                                                        <Icon name="trash" className="w-4 h-4" />  
                                                    </button>  
                                                </div>  
                                            </div>  
                                        ))}  
                                    </div>  
                                </div>  
                            </div>  
                        )}  
  
                    </main>  
  
                    <!-- MODAL 1: QUESTION DETAIL MODAL -->  
                    {activeQuestion && (  
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">  
                            <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar shadow-2xl border border-slate-100 p-6 sm:p-8 space-y-6">  
                                  
                                <div className="flex items-center justify-between pb-4 border-b border-slate-100">  
                                    <span className="bg-amber-100 text-amber-900 text-xs font-black px-3 py-1 rounded-xl">  
                                        {activeQuestion.category || 'أسئلة عامة'}  
                                    </span>  
                                    <button   
                                        onClick={() => { setActiveQuestion(null); window.location.hash = ''; }}  
                                        className="p-2 rounded-full bg-slate-100 text-slate-400 hover:text-slate-700 transition"  
                                    >  
                                        <Icon name="close" className="w-5 h-5" />  
                                    </button>  
                                </div>  
  
                                <div className="space-y-4">  
                                    <h2 className="text-lg sm:text-2xl font-black text-slate-900 leading-relaxed">  
                                        {activeQuestion.question}  
                                    </h2>  
  
                                    <div className="bg-slate-50 rounded-2xl p-5 border border-slate-100 space-y-2">  
                                        <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">الإجابة الشاملة:</div>  
                                        <p className="text-slate-800 text-sm sm:text-base leading-loose whitespace-pre-line font-medium">  
                                            {activeQuestion.answer}  
                                        </p>  
                                    </div>  
  
                                    {activeQuestion.verse && (  
                                        <div className="bg-amber-50/80 border-r-4 border-amber-500 rounded-2xl p-4 text-amber-950 space-y-1">  
                                            <div className="text-[11px] font-black text-amber-800">الآية المرجعية:</div>  
                                            <p className="text-xs sm:text-sm font-bold italic">{activeQuestion.verse}</p>  
                                        </div>  
                                    )}  
  
                                    {activeQuestion.source && (  
                                        <div className="text-xs text-slate-500 flex items-center gap-1.5 pt-1">  
                                            <Icon name="book" className="w-4 h-4 text-amber-600" />  
                                            <span>المصدر: <strong className="text-slate-700">{activeQuestion.source}</strong></span>  
                                        </div>  
                                    )}  
                                </div>  
  
                                <div className="pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">  
                                    <div className="flex items-center gap-2">  
                                        <button   
                                            onClick={(e) => toggleFavorite(activeQuestion.id, e)}  
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${favorites.includes(activeQuestion.id) ? 'bg-amber-500 text-slate-950' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}  
                                        >  
                                            <Icon name={favorites.includes(activeQuestion.id) ? "starFilled" : "star"} />  
                                            <span>{favorites.includes(activeQuestion.id) ? 'في المفضلة' : 'حفظ بالمفضلة'}</span>  
                                        </button>  
                                        <button   
                                            onClick={() => handleSpeakText(activeQuestion.answer)}  
                                            className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-amber-100 hover:text-amber-900 transition flex items-center gap-1.5"  
                                        >  
                                            <Icon name="sound" />  
                                            <span>استماع</span>  
                                        </button>  
                                    </div>  
  
                                    <button   
                                        onClick={(e) => handleShare(activeQuestion, e)}  
                                        className="bg-church-navyDark text-amber-300 hover:bg-slate-900 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow"  
                                    >  
                                        <Icon name="share" />  
                                        <span>مشاركة السؤال</span>  
                                    </button>  
                                </div>  
                            </div>  
                        </div>  
                    )}  
  
                    <!-- MODAL 2: ADMIN LOGIN MODAL -->  
                    {showLoginModal && (  
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">  
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-5">  
                                <div className="text-center space-y-2">  
                                    <div className="w-12 h-12 bg-amber-100 text-amber-800 rounded-2xl flex items-center justify-center mx-auto text-xl font-black">  
                                        <Icon name="lock" />  
                                    </div>  
                                    <h3 className="font-black text-lg text-slate-900">تسجيل دخول المسؤول</h3>  
                                    <p className="text-xs text-slate-500">أدخل كلمة المرور الخاصة بلوحة تحكم الخدام</p>  
                                </div>  
  
                                <form onSubmit={handleAdminLogin} className="space-y-4">  
                                    <div>  
                                        <input   
                                            type="password"   
                                            value={passwordInput}  
                                            onChange={(e) => setPasswordInput(e.target.value)}  
                                            placeholder="كلمة المرور (الافتراضية: 1234)"  
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-center text-sm font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-amber-500"  
                                            autoFocus  
                                        />  
                                        {loginError && <p className="text-rose-600 text-xs font-bold text-center mt-2">{loginError}</p>}  
                                    </div>  
  
                                    <div className="flex items-center gap-2">  
                                        <button   
                                            type="button"   
                                            onClick={() => setShowLoginModal(false)}  
                                            className="w-1/2 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100"  
                                        >  
                                            إلغاء  
                                        </button>  
                                        <button   
                                            type="submit"  
                                            className="w-1/2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-2.5 rounded-xl text-xs shadow transition"  
                                        >  
                                            دخول  
                                        </button>  
                                    </div>  
                                </form>  
                            </div>  
                        </div>  
                    )}  
  
                    <!-- MODAL 3: CHANGE PIN MODAL -->  
                    {showChangePinModal && (  
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">  
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">  
                                <h3 className="font-bold text-base text-slate-900">تغيير كلمة مرور المسؤول</h3>  
                                <form onSubmit={handleChangePin} className="space-y-4">  
                                    <input   
                                        type="text"   
                                        value={newPinInput}  
                                        onChange={(e) => setNewPinInput(e.target.value)}  
                                        placeholder="كلمة المرور الجديدة..."  
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-amber-500"  
                                    />  
                                    <div className="flex justify-end gap-2">  
                                        <button   
                                            type="button"   
                                            onClick={() => setShowChangePinModal(false)}  
                                            className="px-4 py-2 text-xs font-bold text-slate-500"  
                                        >  
                                            إلغاء  
                                        </button>  
                                        <button   
                                            type="submit"  
                                            className="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs shadow"  
                                        >  
                                            حفظ كلمة المرور  
                                        </button>  
                                    </div>  
                                </form>  
                            </div>  
                        </div>  
                    )}  
  
                    <!-- MODAL 4: ADD / EDIT QUESTION MODAL -->  
                    {editingQuestion && (  
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">  
                            <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar shadow-2xl p-6 sm:p-8 space-y-5">  
                                <div className="flex justify-between items-center border-b border-slate-100 pb-3">  
                                    <h3 className="font-bold text-lg text-slate-900">  
                                        {editingQuestion.id ? 'تعديل بيانات السؤال' : 'إضافة سؤال جديد'}  
                                    </h3>  
                                    <button onClick={() => setEditingQuestion(null)} className="text-slate-400 hover:text-slate-600">  
                                        <Icon name="close" />  
                                    </button>  
                                </div>  
  
                                <form onSubmit={handleSaveQuestionForm} className="space-y-4 text-xs font-bold text-slate-700">  
                                    <div>  
                                        <label className="block mb-1">عنوان / نص السؤال *</label>  
                                        <input   
                                            name="question"   
                                            defaultValue={editingQuestion.question || ''}   
                                            required   
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none"  
                                            placeholder="اكتب السؤال بوضوح..."  
                                        />  
                                    </div>  
  
                                    <div>  
                                        <label className="block mb-1">التصنيف / القسم *</label>  
                                        <input   
                                            name="category"   
                                            defaultValue={editingQuestion.category || 'العقيدة'}   
                                            required   
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none"  
                                            placeholder="مثال: العقيدة، العذراء مريم، الأصوام..."  
                                        />  
                                    </div>  
  
                                    <div>  
                                        <label className="block mb-1">الإجابة التفصيلية *</label>  
                                        <textarea   
                                            name="answer"   
                                            defaultValue={editingQuestion.answer || ''}   
                                            required   
                                            rows="5"  
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none resize-none"  
                                            placeholder="اكتب الإجابة الكنسية الشاملة..."  
                                        ></textarea>  
                                    </div>  
  
                                    <div>  
                                        <label className="block mb-1">الآية المرجعية (اختياري)</label>  
                                        <input   
                                            name="verse"   
                                            defaultValue={editingQuestion.verse || ''}   
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none"  
                                            placeholder="مثال: «صَلاَةُ الْبَارِّ تَقْتَدِرُ كَثِيرًا فِي فِعْلِهَا» (يعقوب 5: 16)"  
                                        />  
                                    </div>  
  
                                    <div>  
                                        <label className="block mb-1">المصدر / الكتاب (اختياري)</label>  
                                        <input   
                                            name="source"   
                                            defaultValue={editingQuestion.source || ''}   
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none"  
                                            placeholder="مثال: كتاب سنوات مع أسئلة الناس - البابا شنودة الثالث"  
                                        />  
                                    </div>  
  
                                    <div>  
                                        <label className="block mb-1">الكلمات المفتاحية (للبحث)</label>  
                                        <input   
                                            name="keywords"   
                                            defaultValue={editingQuestion.keywords || ''}   
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none"  
                                            placeholder="شفاعة, صلاة, قداس, صوم..."  
                                        />  
                                    </div>  
  
                                    <div className="pt-2 flex justify-end gap-2">  
                                        <button   
                                            type="button"   
                                            onClick={() => setEditingQuestion(null)}  
                                            className="px-5 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100"  
                                        >  
                                            إلغاء  
                                        </button>  
                                        <button   
                                            type="submit"  
                                            className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-6 py-2.5 rounded-xl text-xs shadow"  
                                        >  
                                            حفظ السؤال  
                                        </button>  
                                    </div>  
                                </form>  
                            </div>  
                        </div>  
                    )}  
  
                    <!-- TOAST NOTIFICATION -->  
                    {toastMessage && (  
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-amber-300 border border-amber-500/40 px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-2 animate-fade-in">  
                            <Icon name="sparkles" className="w-4 h-4 text-amber-400" />  
                            <span>{toastMessage}</span>  
                        </div>  
                    )}  
  
                    <!-- CONFIRM MODAL -->  
                    <ConfirmModal   
                        isOpen={confirmState.isOpen}  
                        title={confirmState.title}  
                        message={confirmState.message}  
                        onConfirm={confirmState.onConfirm}  
                        onCancel={() => setConfirmState({ isOpen: false })}  
                    />  
  
                    <!-- Footer -->  
                    <footer className="bg-church-navyDark text-slate-400 border-t border-slate-800 py-8 text-center text-xs space-y-2 mt-12">  
                        <div className="flex items-center justify-center gap-2 text-amber-400 font-bold">  
                            <Icon name="cross" className="w-4 h-4" />  
                            <span>كنيسة الأنبا شنودة رئيس المتوحدين بالزرابي</span>  
                        </div>  
                        <p className="text-slate-500">منصة الأسئلة الشبابية الإيمانية والكتابية &copy; {new Date().getFullYear()}</p>  
                    </footer>  
  
                </div>  
            );  
        }  
  
        // Render application  
        const rootElement = document.getElementById('root');  
        const root = ReactDOM.createRoot(rootElement);  
        root.render(<App />);  
    </script>  
</body>  
</html>
