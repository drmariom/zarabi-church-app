                        setQuestions(DEFAULT_QUESTIONS);
                    }
                } else {
                    setQuestions(DEFAULT_QUESTIONS);
                    localStorage.setItem('zarabi_church_questions', JSON.stringify(DEFAULT_QUESTIONS));
                }

                const savedFavs = localStorage.getItem('zarabi_church_favs');
                if (savedFavs) {
                    try { setFavorites(JSON.parse(savedFavs)); } catch (e) {}
                }

                const savedPin = localStorage.getItem('zarabi_church_admin_pin');
                if (savedPin) {
                    setAdminPin(savedPin);
                }

                // Check URL hash for direct links (e.g., #/q/1)
                const checkHash = () => {
                    const hash = window.location.hash.replace('#/q/', '');
                    if (hash) {
                        const found = currentQuestions.find(q => String(q.id) === String(hash));
                        if (found) setActiveQuestion(found);
                    }
                };

                checkHash();
                window.addEventListener('hashchange', checkHash);
                return () => window.removeEventListener('hashchange', checkHash);
            }, []);

            // Trigger PWA install or show instructions
            const handleInstallApp = () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choice) => {
                        if (choice.outcome === 'accepted') {
                            showToast('تم البدء في إضافـة التطبيق للشاشة الرئيسية 🎉');
                        }
                        setDeferredPrompt(null);
                    });
                } else {
                    setShowInstallGuideModal(true);
                }
            };

            const saveQuestionsToStorage = (newQuestions) => {
                setQuestions(newQuestions);
                localStorage.setItem('zarabi_church_questions', JSON.stringify(newQuestions));
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passwordInput.trim() === adminPin) {
                    setIsAdminLoggedIn(true);
                    setShowLoginModal(false);
                    setPasswordInput('');
                    setLoginError('');
                    setViewMode('admin');
                    showToast('تم تسجيل الدخول بصلاحيات المسؤول 🔑');
                } else {
                    setLoginError('كلمة المرور غير صحيحة! حاول مرة أخرى.');
                }
            };

            const handleChangePin = (e) => {
                e.preventDefault();
                if (newPinInput.trim().length < 3) {
                    alert('كلمة المرور يجب أن تكون 3 أحرف/أرقام على الأقل');
                    return;
                }
                setAdminPin(newPinInput.trim());
                localStorage.setItem('zarabi_church_admin_pin', newPinInput.trim());
                setShowChangePinModal(false);
                setNewPinInput('');
                showToast('تم تغيير كلمة مرور المسؤول بنجاح 🔒');
            };

            const handleAdminLogout = () => {
                setIsAdminLoggedIn(false);
                setViewMode('home');
                showToast('تم تسجيل الخروج وقفل لوحة التحكم 🔒');
            };

            const navigateToAdmin = () => {
                if (isAdminLoggedIn) {
                    setViewMode('admin');
                } else {
                    setShowLoginModal(true);
                }
            };

            const categories = useMemo(() => {
                const set = new Set();
                questions.forEach(q => {
                    if (q.category && q.category.trim()) {
                        set.add(q.category.trim());
                    }
                });
                return ['الكل', ...Array.from(set)];
            }, [questions]);

            const filteredQuestions = useMemo(() => {
                return questions.filter(q => {
                    const matchesCategory = selectedCategory === 'الكل' || q.category === selectedCategory;
                    const query = searchQuery.trim().toLowerCase();
                    if (!query) return matchesCategory;

                    const inQuestion = q.question && q.question.toLowerCase().includes(query);
                    const inAnswer = q.answer && q.answer.toLowerCase().includes(query);
                    const inCategory = q.category && q.category.toLowerCase().includes(query);
                    const inKeywords = q.keywords && q.keywords.toLowerCase().includes(query);

                    return matchesCategory && (inQuestion || inAnswer || inCategory || inKeywords);
                });
            }, [questions, selectedCategory, searchQuery]);

            const questionOfTheDay = useMemo(() => {
                if (questions.length === 0) return null;
                const today = new Date().toISOString().slice(0, 10);
                let hash = 0;
                for (let i = 0; i < today.length; i++) {
                    hash = today.charCodeAt(i) + ((hash << 5) - hash);
                }
                const index = Math.abs(hash) % questions.length;
                return questions[index];
            }, [questions]);

            const toggleFavorite = (qId, e) => {
                if (e) e.stopPropagation();
                let updated;
                if (favorites.includes(qId)) {
                    updated = favorites.filter(id => id !== qId);
                    showToast('تمت إزالة السؤال من المفضلة');
                } else {
                    updated = [...favorites, qId];
                    showToast('تم حفظ السؤال في المفضلة ⭐');
                }
                setFavorites(updated);
                localStorage.setItem('zarabi_church_favs', JSON.stringify(updated));
            };

            const pickRandomQuestion = () => {
                if (questions.length === 0) return;
                const randomIndex = Math.floor(Math.random() * questions.length);
                const randomQ = questions[randomIndex];
                setActiveQuestion(randomQ);
                window.location.hash = `#/q/${randomQ.id}`;
            };

            const handleShare = (q, e) => {
                if (e) e.stopPropagation();
                const shareUrl = `${window.location.origin}${window.location.pathname}#/q/${q.id}`;
                
                if (navigator.share) {
                    navigator.share({
                        title: q.question,
                        text: `إليك إجابة سؤال: ${q.question} - كنيسة الأنبا شنودة بالزرابي`,
                        url: shareUrl
                    }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(shareUrl);
                    showToast('تم نسخ رابط السؤال إلى الحافظة 📋');
                }
            };

            const processCSVData = (csvContent) => {
                if (!isAdminLoggedIn) return alert('عفواً، يتطلب استيراد البيانات تسجِيل الدخول كمسؤول.');
                Papa.parse(csvContent, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            const imported = results.data.map((row, idx) => {
                                const getVal = (possibleKeys) => {
                                    for (let k of possibleKeys) {
                                        const key = Object.keys(row).find(x => x.trim().toLowerCase() === k.toLowerCase());
                                        if (key && row[key]) return row[key].trim();
                                    }
                                    return '';
                                };

                                return {
                                    id: String(getVal(['id', 'رقم', 'م']) || Date.now() + idx),
                                    question: getVal(['question', 'السؤال', 'سؤال', 'س']),
                                    answer: getVal(['answer', 'الاجابة', 'الإجابة', 'اجابة', 'إجابة', 'ج']),
                                    category: getVal(['category', 'القسم', 'التصنيف', 'قسم']) || 'أسئلة عامة',
                                    verse: getVal(['verse', 'الآية', 'اية', 'الآيه', 'المرجع']),
                                    source: getVal(['source', 'المصدر', 'مصدر']),
                                    keywords: getVal(['keywords', 'كلمات مفتاحية', 'الكلمات المفتاحية', 'tags'])
                                };
                            }).filter(q => q.question && q.answer);

                            if (imported.length > 0) {
                                saveQuestionsToStorage(imported);
                                showToast(`تم استيراد ${imported.length} سؤال بنجاح! 🎉`);
                                setViewMode('home');
                            } else {
                                alert('لم يتم العثور على أسئلة صالحة. تأكد من إدراج أعمدة (السؤال) و (الإجابة).');
                            }
                        } else {
                            alert('ملف CSV فارغ أو غير صحيح.');
                        }
                    },
                    error: (err) => {
                        alert('حدث خطأ أثناء قراءة البيانات: ' + err.message);
                    }
                });
            };

            const handleFetchGoogleSheet = async () => {
                if (!isAdminLoggedIn) return alert('عفواً، هذه الخاصية متاحة فقط للمسؤولين.');
                if (!sheetUrl) return alert('برجاء إدخال رابط Google Sheet أو رابط CSV للأنظار');
                let finalUrl = sheetUrl.trim();
                
                if (finalUrl.includes('docs.google.com/spreadsheets') && !finalUrl.includes('export?format=csv')) {
                    const match = finalUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                    if (match && match[1]) {
                        finalUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv`;
                    }
                }

                try {
                    showToast('جاري تحمِيل البيانات من Google Sheet...');
                    const res = await fetch(finalUrl);
                    if (!res.ok) throw new Error('تعذر الوصول للملف. تأكد أن الشيت منشور للعوام (Public).');
                    const text = await res.text();
                    processCSVData(text);
                } catch (err) {
                    alert('خطأ أثناء التحميل: ' + err.message);
                }
            };

            const handleSaveQuestion = (e) => {
                e.preventDefault();
                if (!isAdminLoggedIn) return alert('غير مصرح لك بالإضافة.');
                const formData = new FormData(e.target);
                const newQ = {
                    id: editingQuestion?.id || String(Date.now()),
                    question: formData.get('question'),
                    answer: formData.get('answer'),
                    category: formData.get('category') || 'أسئلة متنوعة',
                    verse: formData.get('verse'),
                    source: formData.get('source'),
                    keywords: formData.get('keywords')
                };

                let updated;
                if (editingQuestion) {
                    updated = questions.map(q => q.id === editingQuestion.id ? newQ : q);
                    showToast('تم تعديل السؤال بنجاح ✨');
                } else {
                    updated = [newQ, ...questions];
                    showToast('تمت إضافة السؤال بنجاح ✨');
                }

                saveQuestionsToStorage(updated);
                setEditingQuestion(null);
            };

            const handleDeleteQuestion = (id) => {
                if (!isAdminLoggedIn) return alert('غير مصرح لك بالحذف.');
                if (confirm('هل أنت تأكد من حذف هذا السؤال؟')) {
                    const updated = questions.filter(q => q.id !== id);
                    saveQuestionsToStorage(updated);
                    showToast('تم حذف السؤال');
                }
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 bg-church-navy text-white px-6 py-3 rounded-full shadow-2xl border border-church-gold/40 flex items-center gap-2 text-sm font-semibold animate-bounce">
                            <Icon name="sparkles" className="w-4 h-4 text-church-gold" />
                            {toastMessage}
                        </div>
                    )}

                    {/* Navigation Header */}
                    <header className="sticky top-0 z-40 bg-church-navyDark text-white shadow-md border-b border-white/10 backdrop-blur-md">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 h-18 flex items-center justify-between">
                            
                            {/* Logo / Title */}
                            <div 
                                onClick={() => { setViewMode('home'); setActiveQuestion(null); }}
                                className="flex items-center gap-3 cursor-pointer group py-2"
                            >
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-church-gold to-amber-600 flex items-center justify-center text-church-navy font-bold shadow-lg group-hover:scale-105 transition-transform">
                                    <Icon name="cross" className="w-6 h-6 text-white" />
                                </div>
                                <div>
                                    <h1 className="font-bold text-base sm:text-lg leading-tight text-slate-100 group-hover:text-church-gold transition-colors">
                                        كنيسة الأنبا شنودة
                                    </h1>
                                    <p className="text-xs text-amber-300/80 font-tajawal">رئيس المتوحدين بالزرابي ✝️</p>
                                </div>
                            </div>

                            {/* Desktop Navigation Links */}
                            <nav className="hidden md:flex items-center gap-2">
                                <button 
                                    onClick={() => { setViewMode('home'); setActiveQuestion(null); }}
                                    className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${viewMode === 'home' ? 'bg-amber-500/20 text-church-gold border border-church-gold/30' : 'text-slate-300 hover:text-white hover:bg-white/5'}`}
                                >
                                    الرئيسية
                                </button>
                                
                                {/* Add to Home Screen PWA Button */}
                                <button 
                                    onClick={handleInstallApp}
                                    className="px-3.5 py-2 rounded-lg text-xs font-bold bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 border border-amber-500/30 flex items-center gap-1.5 transition-all"
                                >
                                    <Icon name="mobile" className="w-4 h-4 text-amber-400" />
                                    تثبيت التطبيق 📲
                                </button>

                                <button 
                                    onClick={pickRandomQuestion}
                                    className="px-3.5 py-2 rounded-lg text-xs font-semibold text-slate-200 hover:bg-white/5 transition-all flex items-center gap-1.5 border border-white/10"
                                >
                                    <Icon name="dice" className="w-4 h-4 text-amber-400" />
                                    سؤال عشوائي
                                </button>

                                <button 
                                    onClick={() => setViewMode('favorites')}
                                    className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${viewMode === 'favorites' ? 'bg-amber-500/20 text-church-gold border border-church-gold/30' : 'text-slate-300 hover:text-white hover:bg-white/5'}`}
                                >
                                    <Icon name="star" className="w-4 h-4 text-amber-400" />
                                    المفضلة ({favorites.length})
                                </button>
                                
                                <button 
                                    onClick={navigateToAdmin}
                                    className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${
                                        isAdminLoggedIn 
                                            ? 'bg-emerald-700 text-white hover:bg-emerald-600' 
                                            : 'bg-slate-800 text-amber-300 hover:bg-slate-700 border border-amber-500/30'
                                    }`}
                                >
                                    <Icon name={isAdminLoggedIn ? "settings" : "lock"} className="w-4 h-4 text-amber-400" />
                                    {isAdminLoggedIn ? 'لوحة التحكم' : 'دخول المسؤول 🔐'}
                                </button>

                                {isAdminLoggedIn && (
                                    <button 
                                        onClick={handleAdminLogout}
                                        title="تسجيل خروج الأدمن"
                                        className="p-2 text-rose-300 hover:text-rose-100 bg-rose-950/60 hover:bg-rose-900 rounded-lg text-xs transition-colors"
                                    >
                                        <Icon name="logout" className="w-4 h-4" />
                                    </button>
                                )}
                            </nav>

                            {/* Mobile Actions Header */}
                            <div className="md:hidden flex items-center gap-2">
                                <button 
                                    onClick={handleInstallApp}
                                    className="px-2.5 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-bold flex items-center gap-1"
                                >
                                    <Icon name="mobile" className="w-3.5 h-3.5" />
                                    تثبيت التطبيق
                                </button>
                                <button 
                                    onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                                    className="p-2 text-slate-300 hover:text-white"
                                >
                                    <Icon name={isMobileMenuOpen ? "close" : "menu"} className="w-6 h-6" />
                                </button>
                            </div>
                        </div>

                        {/* Mobile Menu Dropdown */}
                        {isMobileMenuOpen && (
                            <div className="md:hidden bg-church-navy border-b border-white/10 px-4 py-3 space-y-2">
                                <button 
                                    onClick={() => { setViewMode('home'); setActiveQuestion(null); setIsMobileMenuOpen(false); }}
                                    className="w-full text-right px-4 py-2.5 rounded-lg text-sm text-slate-200 hover:bg-white/5 flex items-center gap-2"
                                >
                                    <Icon name="book" className="w-4 h-4 text-amber-400" />
                                    الرئيسية والأسئلة
                                </button>
                                <button 
                                    onClick={() => { handleInstallApp(); setIsMobileMenuOpen(false); }}
                                    className="w-full text-right px-4 py-2.5 rounded-lg text-sm text-amber-300 font-bold bg-amber-500/10 hover:bg-amber-500/20 flex items-center gap-2"
                                >
                                    <Icon name="mobile" className="w-4 h-4 text-amber-400" />
                                    إضافة التطبيق للشاشة الرئيسية 📲
                                </button>
                                <button 
                                    onClick={() => { setViewMode('favorites'); setIsMobileMenuOpen(false); }}
                                    className="w-full text-right px-4 py-2.5 rounded-lg text-sm text-slate-200 hover:bg-white/5 flex items-center gap-2"
                                >
                                    <Icon name="star" className="w-4 h-4 text-amber-400" />
                                    المفضلة ({favorites.length})
                                </button>
                                <button 
                                    onClick={() => { navigateToAdmin(); setIsMobileMenuOpen(false); }}
                                    className="w-full text-right px-4 py-2.5 rounded-lg text-sm text-amber-300 hover:bg-white/5 flex items-center gap-2 font-bold"
                                >
                                    <Icon name={isAdminLoggedIn ? "settings" : "lock"} className="w-4 h-4 text-amber-400" />
                                    {isAdminLoggedIn ? 'لوحة التحكم' : 'لوحة المسؤول (كلمة سر) 🔐'}
                                </button>
                            </div>
                        )}
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-grow">
                        
                        {/* VIEW 1: ADMIN PANEL */}
                        {viewMode === 'admin' && isAdminLoggedIn ? (
                            <div className="max-w-5xl mx-auto px-4 py-8">
                                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <h2 className="text-2xl font-bold text-church-navy">📊 لوحة التحكم والإدارة</h2>
                                            <span className="px-2.5 py-0.5 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full border border-emerald-300">
                                                مشرف معتمد 🔐
                                            </span>
                                        </div>
                                        <p className="text-slate-500 text-sm mt-1">إضافة وتعديل الأسئلة أو ربط Google Sheet مباشرة.</p>
                                    </div>
                                    
                                    <div className="flex items-center gap-2 self-stretch sm:self-auto">
                                        <button 
                                            onClick={() => setShowChangePinModal(true)}
                                            className="px-3 py-2 bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-lg font-semibold text-xs flex items-center gap-1.5"
                                        >
                                            <Icon name="key" className="w-4 h-4 text-amber-600" />
                                            تغيير كلمة السر
                                        </button>
                                        <button 
                                            onClick={handleAdminLogout}
                                            className="px-3 py-2 bg-rose-100 text-rose-700 hover:bg-rose-200 rounded-lg font-semibold text-xs flex items-center gap-1"
                                        >
                                            <Icon name="logout" className="w-4 h-4" />
                                            قفل اللوحة
                                        </button>
                                        <button 
                                            onClick={() => setViewMode('home')}
                                            className="px-4 py-2 bg-church-navy text-white rounded-lg font-semibold hover:bg-slate-800 text-xs flex items-center gap-1"
                                        >
                                            <Icon name="arrowRight" className="w-4 h-4" />
                                            العودة للموقع
                                        </button>
                                    </div>
                                </div>

                                {/* Stats Overview */}
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                                        <div>
                                            <p className="text-xs font-semibold text-slate-400">إجمالي الأسئلة</p>
                                            <p className="text-2xl font-bold text-church-navy">{questions.length}</p>
                                        </div>
                                        <div className="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
                                            <Icon name="book" className="w-5 h-5" />
                                        </div>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                                        <div>
                                            <p className="text-xs font-semibold text-slate-400">عدد الأقسام</p>
                                            <p className="text-2xl font-bold text-amber-600">{categories.length - 1}</p>
                                        </div>
                                        <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                                            <Icon name="sparkles" className="w-5 h-5" />
                                        </div>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                                        <div>
                                            <p className="text-xs font-semibold text-slate-400">حالة الأمان</p>
                                            <p className="text-base font-bold text-emerald-600">محمية بكلمة سر 🔒</p>
                                        </div>
                                        <div className="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                                            <Icon name="lock" className="w-5 h-5" />
                                        </div>
                                    </div>
                                </div>

                                {/* Import Google Sheet / CSV Section */}
                                <div className="bg-gradient-to-r from-emerald-900 to-teal-900 text-white p-6 rounded-2xl shadow-lg mb-8">
                                    <div className="flex items-center gap-3 mb-4">
                                        <div className="w-10 h-10 rounded-xl bg-emerald-500/20 flex items-center justify-center text-emerald-300">
                                            <Icon name="upload" className="w-6 h-6" />
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-lg">📥 استيراد الأسئلة من Google Sheet / CSV</h3>
                                            <p className="text-xs text-emerald-200">ضع رابط شيت الجوجل المنشور، أو ارفع ملف CSV مباشر</p>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="flex flex-col sm:flex-row gap-2">
                                            <input 
                                                type="url" 
                                                value={sheetUrl}
                                                onChange={(e) => setSheetUrl(e.target.value)}
                                                placeholder="ضع رابط Google Sheet المنشور هنا..."
                                                className="flex-grow px-4 py-2.5 rounded-xl bg-emerald-950/60 border border-emerald-500/40 text-white placeholder-emerald-400/60 text-sm focus:outline-none focus:border-amber-400"
                                            />
                                            <button 
                                                onClick={handleFetchGoogleSheet}
                                                className="px-6 py-2.5 bg-amber-500 text-slate-900 font-bold rounded-xl hover:bg-amber-400 text-sm transition-all flex items-center justify-center gap-2"
                                            >
                                                <Icon name="refresh" className="w-4 h-4" />
                                                جلب واستيراد
                                            </button>
                                        </div>

                                        <div className="flex items-center justify-between border-t border-emerald-800/60 pt-4">
                                            <span className="text-xs text-emerald-200">أو رفع ملف .CSV مباشرة:</span>
                                            <label className="cursor-pointer px-4 py-2 bg-emerald-700/60 hover:bg-emerald-600 rounded-lg text-xs font-semibold flex items-center gap-2">
                                                <Icon name="upload" className="w-4 h-4" />
                                                اختر ملف CSV
                                                <input 
                                                    type="file" 
                                                    accept=".csv" 
                                                    className="hidden" 
                                                    onChange={(e) => {
                                                        const file = e.target.files[0];
                                                        if (file) {
                                                            const reader = new FileReader();
                                                            reader.onload = (evt) => processCSVData(evt.target.result);
                                                            reader.readAsText(file);
                                                        }

                                </div>

                                <h3 className="text-xl font-bold text-church-navy mb-1">تسجيل الدخول للمسؤول 🔐</h3>
                                <p className="text-xs text-slate-500 mb-6 font-tajawal">
                                    أدخل كلمة المرور الخاصة بالإدارة (كلمة السر الافتراضية هي: <strong className="text-amber-700">1234</strong>)
                                </p>

                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <div>
                                        <input 
                                            type="password" 
                                            value={passwordInput}
                                            onChange={(e) => { setPasswordInput(e.target.value); setLoginError(''); }}
                                            placeholder="أدخل كلمة المرور..."
                                            autoFocus
                                            className="w-full text-center text-lg font-bold px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-church-navy focus:outline-none"
                                        />
                                        {loginError && (
                                            <p className="text-xs text-rose-600 font-bold mt-2">{loginError}</p>
                                        )}
                                    </div>

                                    <div className="flex items-center gap-2">
                                        <button 
                                            type="button"
                                            onClick={() => setShowLoginModal(false)}
                                            className="flex-1 py-3 border border-slate-200 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-50"
                                        >
                                            إلغاء
                                        </button>
                                        <button 
                                            type="submit"
                                            className="flex-1 py-3 bg-church-navy text-amber-300 hover:bg-slate-800 rounded-xl text-xs font-bold shadow-md transition-colors"
                                        >
                                            تأكيد الدخول
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* CHANGE ADMIN PIN MODAL */}
                    {showChangePinModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-100 relative">
                                <button 
                                    onClick={() => setShowChangePinModal(false)}
                                    className="absolute top-4 left-4 p-1.5 text-slate-400 hover:text-slate-600 rounded-full bg-slate-100"
                                >
                                    <Icon name="close" className="w-5 h-5" />
                                </button>

                                <div className="w-12 h-12 bg-blue-100 text-blue-700 rounded-2xl flex items-center justify-center mb-3">
                                    <Icon name="key" className="w-6 h-6" />
                                </div>

                                <h3 className="text-lg font-bold text-church-navy mb-1">تغيير كلمة سر الإدارة</h3>
                                <p className="text-xs text-slate-500 mb-6">اكتب كلمة المرور الجديدة للحفاظ على خصوصية التعديلات.</p>

                                <form onSubmit={handleChangePin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">كلمة المرور الجديدة</label>
                                        <input 
                                            type="text" 
                                            value={newPinInput}
                                            onChange={(e) => setNewPinInput(e.target.value)}
                                            placeholder="مثال: MyChurch#2026"
                                            required
                                            className="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-church-navy focus:outline-none"
                                        />
                                    </div>

                                    <div className="flex items-center justify-end gap-2 pt-2">
                                        <button 
                                            type="button"
                                            onClick={() => setShowChangePinModal(false)}
                                            className="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-xs font-bold"
                                        >
                                            إلغاء
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-5 py-2 bg-emerald-700 text-white hover:bg-emerald-800 rounded-xl text-xs font-bold shadow-md"
                                        >
                                            حفظ كلمة المرور
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* QUESTION DETAIL MODAL */}
                    {activeQuestion && (
                        <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl border border-slate-100 w-full max-w-3xl max-h-[92vh] flex flex-col my-auto overflow-hidden">
                                
                                <div className="bg-gradient-to-r from-church-navyDark to-church-navy text-white p-5 sm:p-6 flex items-start justify-between relative">
                                    <div className="space-y-2 pr-2">
                                        <span className="px-3 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-full text-xs font-bold inline-block">
                                            ✝️ {activeQuestion.category}
                                        </span>
                                        <h2 className="text-xl sm:text-2xl font-bold leading-relaxed text-white">
                                            {activeQuestion.question}
                                        </h2>
                                    </div>
                                    <button 
                                        onClick={() => { setActiveQuestion(null); window.location.hash = ''; }}
                                        className="p-2 rounded-full bg-white/10 text-white hover:bg-white/20 transition-colors shrink-0"
                                    >
                                        <Icon name="close" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-6 sm:p-8 space-y-6 overflow-y-auto custom-scrollbar flex-grow">
                                    <div className="bg-slate-50 border border-slate-200/80 p-6 rounded-2xl space-y-3">
                                        <h3 className="text-sm font-extrabold text-church-navy flex items-center gap-2">
                                            <Icon name="sparkles" className="w-5 h-5 text-amber-500" />
                                            💡 الإجابة:
                                        </h3>
                                        <div className="text-slate-700 text-base leading-relaxed space-y-3 font-tajawal whitespace-pre-line">
                                            {activeQuestion.answer}
                                        </div>
                                    </div>

                                    {activeQuestion.verse && (
                                        <div className="bg-amber-50/70 border border-amber-200/80 p-5 rounded-2xl space-y-2">
                                            <h4 className="text-xs font-bold text-amber-900 flex items-center gap-2">
                                                <Icon name="book" className="w-4 h-4 text-amber-600" />
                                                📖 من الكتاب المقدس:
                                            </h4>
                                            <p className="text-sm sm:text-base font-bold text-amber-950 italic leading-relaxed">
                                                {activeQuestion.verse}
                                            </p>
                                        </div>
                                    )}

                                    {activeQuestion.source && (
                                        <div className="bg-blue-50/60 border border-blue-100 p-4 rounded-xl flex items-center gap-3 text-xs text-blue-900">
                                            <Icon name="church" className="w-5 h-5 text-blue-600 shrink-0" />
                                            <div>
                                                <span className="font-bold">📚 المصدر: </span>
                                                <span>{activeQuestion.source}</span>
                                            </div>
                                        </div>
                                    )}

                                    {/* RELATED QUESTIONS SECTION */}
                                    <div className="border-t border-slate-100 pt-6 space-y-3">
                                        <h4 className="text-xs font-extrabold text-slate-500 uppercase tracking-wider">
                                            أسئلة ذات صلة:
                                        </h4>
                                        <div className="space-y-2">
                                            {questions
                                                .filter(q => q.category === activeQuestion.category && q.id !== activeQuestion.id)
                                                .slice(0, 3)
                                                .map(relQ => (
                                                    <div 
                                                        key={relQ.id}
                                                        onClick={() => setActiveQuestion(relQ)}
                                                        className="p-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl cursor-pointer transition-all text-xs font-bold text-slate-700 hover:text-church-navy flex items-center justify-between"
                                                    >
                                                        <span>• {relQ.question}</span>
                                                        <Icon name="arrowLeft" className="w-3.5 h-3.5 text-slate-400" />
                                                    </div>
                                                ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="p-4 bg-slate-100 border-t border-slate-200/80 flex flex-wrap items-center justify-between gap-3">
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={(e) => toggleFavorite(activeQuestion.id, e)}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                                favorites.includes(activeQuestion.id)
                                                    ? 'bg-amber-500 text-white shadow'
                                                    : 'bg-white text-slate-700 hover:bg-slate-200'
                                            }`}
                                        >
                                            <Icon name={favorites.includes(activeQuestion.id) ? "starFilled" : "star"} className="w-4 h-4 text-amber-300" />
                                            {favorites.includes(activeQuestion.id) ? 'محفوظ للمفضلة' : 'حفظ السؤال'}
                                        </button>
                                        <button 
                                            onClick={(e) => handleShare(activeQuestion, e)}
                                            className="px-4 py-2 bg-white hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all"
                                        >
                                            <Icon name="share" className="w-4 h-4 text-blue-600" />
                                            شارك السؤال 📤
                                        </button>
                                    </div>

                                    <button 
                                        onClick={pickRandomQuestion}
                                        className="px-5 py-2 bg-church-navy text-amber-300 hover:bg-slate-800 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all"
                                    >
                                        <span>سؤال عشوائي آخر 🎲</span>
                                    </button>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="bg-church-navyDark text-slate-400 text-xs border-t border-white/10 mt-12 py-10">
                        <div className="max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-right">
                            <div className="space-y-2">
                                <div className="flex items-center justify-center md:justify-start gap-2 text-white font-bold text-sm">
                                    <span>كنيسة الأنبا شنودة رئيس المتوحدين بالزرابي ✝️</span>
                                </div>
                                <p className="text-slate-400 max-w-md font-tajawal">
                                    منصة شبكية مخصصة لمناقشة وإجابة كافة الأسئلة الإيمانية والكتابية والطقسية بأسلوب بسيط وجذاب للشباب.
                                </p>
                            </div>

                            <div className="flex flex-col items-center md:items-end gap-2">
                                <div className="flex items-center gap-4 text-slate-300">
                                    <button onClick={() => setViewMode('home')} className="hover:text-amber-400">الرئيسية</button>
                                    <span>•</span>
                                    <button onClick={() => setViewMode('favorites')} className="hover:text-amber-400">المفضلة</button>
                                    <span>•</span>
                                    <button onClick={handleInstallApp} className="hover:text-amber-400 font-bold text-amber-300">تثبيت التطبيق 📲</button>
                                </div>
                                <p className="text-slate-500 font-tajawal">جميع الحقوق محفوظة © {new Date().getFullYear()} - كنيسة الأنبا شنودة بالزرابي</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        // Reusable Question Card Component
        function QuestionCard({ q, isFav, onToggleFav, onOpen, onShare }) {
            return (
                <div 
                    onClick={onOpen}
                    className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col justify-between group relative overflow-hidden"
                >
                    <div className="space-y-3">
                        <div className="flex items-center justify-between">
                            <span className="text-[11px] font-bold px-3 py-1 bg-amber-50 text-amber-800 rounded-full border border-amber-200/60">
                                ✝️ {q.category || 'عام'}
                            </span>
                            
                            <div className="flex items-center gap-1">
                                <button 
                                    onClick={onShare}
                                    className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
                                    title="مشاركة"
                                >
                                    <Icon name="share" className="w-4 h-4" />
                                </button>
                                <button 
                                    onClick={onToggleFav}
                                    className={`p-1.5 rounded-lg transition-colors ${
                                        isFav ? 'text-amber-500 bg-amber-50' : 'text-slate-300 hover:text-amber-500 hover:bg-slate-100'
                                    }`}
                                    title="حفظ للمفضلة"
                                >
                                    <Icon name={isFav ? "starFilled" : "star"} className="w-4 h-4" />
                                </button>
                            </div>
                        </div>

                        <h3 className="font-bold text-slate-800 text-base leading-snug group-hover:text-church-navy transition-colors">
                            {q.question}
                        </h3>

                        <p className="text-slate-500 text-xs line-clamp-2 leading-relaxed font-tajawal">
                            {q.answer}
                        </p>
                    </div>

                    <div className="pt-4 mt-4 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-church-navy group-hover:text-amber-600 transition-colors">
                        <span>شوف الإجابة</span>
                        <Icon name="arrowLeft" className="w-4 h-4 transform group-hover:-translate-x-1 transition-transform" />
                    </div>
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
